[package]
name = "duckguard"
version = "0.1.0"
edition = "2021"
description = "Dockerfile, Compose and running-container configuration scanner"
license = "MIT"
repository = "https://github.com/dRafaleD/DuckGuard"
readme = "README.md"

[profile.release]
strip = true
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
