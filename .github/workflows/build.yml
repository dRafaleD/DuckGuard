name: Build and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/duckguard dist/DuckGuard
          cp scripts/install.sh README.md LICENSE dist/
          tar -czf DuckGuard-linux-x86_64.tar.gz -C dist DuckGuard install.sh README.md LICENSE
          mv DuckGuard-linux-x86_64.tar.gz dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DuckGuard-${{ runner.os }}-x86_64
          path: |
            dist/*.zip
            dist/*.tar.gz

